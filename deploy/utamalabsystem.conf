# ==============================================================================
# Konfigurasi Reverse Proxy Nginx untuk Domain Resmi:
# utamalabsystem.cloud & www.utamalabsystem.cloud
#
# Letakkan di: /etc/nginx/sites-available/utamalabsystem.conf
# Lalu aktifkan: ln -sf /etc/nginx/sites-available/utamalabsystem.conf /etc/nginx/sites-enabled/
# Uji sintaks: nginx -t
# Terapkan: systemctl reload nginx
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name utamalabsystem.cloud www.utamalabsystem.cloud;

    client_max_body_size 50M;

    # Web App RME & LIS Laboratorium Medis Utama
    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # API Supabase Kong (Port 8001)
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
